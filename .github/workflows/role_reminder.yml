name: Meikyo Role Reminder

on:
  schedule:
    # 13:00 UTC = 22:00 JST 指定。Actions の cron は当リポジトリで常に60〜70分遅延するため、
    # 実際の着弾は 23:00〜23:10 JST 前後になる想定（「23時に届く」を優先した設定）。
    # 名目どおり23:00に鳴らしたい場合は "0 14 * * *" に変更する。
    - cron: "0 13 * * *"
  workflow_dispatch:       # GitHub画面から手動実行も可能

# 他ワークフローと同時にDiscord APIを叩かないよう独立グループで直列化
concurrency:
  group: role-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # まだ投稿に使われていない報告が届いていれば、スクリプト側でスキップする（二重催促しない）
      - name: Send role report reminder
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 role_reminder.py
